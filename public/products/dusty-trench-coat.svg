<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F1EF"/>
      <stop offset="50%" stop-color="#F2E1DD"/>
      <stop offset="100%" stop-color="#E8CECA"/>
    </linearGradient>
    <linearGradient id="trench" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDA1A8"/>
      <stop offset="100%" stop-color="#BA717A"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6F3940" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="500" fill="url(#bg3)"/>
  <circle cx="200" cy="225" r="140" fill="#FFFFFF" fill-opacity="0.45"/>
  <circle cx="290" cy="110" r="75" fill="#E2B1B7" fill-opacity="0.3"/>
  <circle cx="95" cy="380" r="80" fill="#DAB0B5" fill-opacity="0.3"/>

  <!-- Trench Coat Silhouette -->
  <g filter="url(#shadow3)">
    <!-- Coat Body -->
    <path d="M 160 120 L 130 180 L 148 200 L 160 160 L 155 365 L 245 365 L 240 160 L 252 200 L 270 180 L 240 120 Z" fill="url(#trench)"/>
    <!-- Lapels -->
    <path d="M 160 120 L 180 200 L 200 135 L 220 200 L 240 120 Z" fill="#A85C66"/>
    <!-- Belt with buckle -->
    <rect x="150" y="235" width="100" height="12" rx="3" fill="#88424B"/>
    <rect x="192" y="232" width="16" height="18" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- Double-breasted buttons -->
    <circle cx="180" cy="205" r="3.5" fill="#5E2B32"/>
    <circle cx="220" cy="205" r="3.5" fill="#5E2B32"/>
    <circle cx="180" cy="280" r="3.5" fill="#5E2B32"/>
    <circle cx="220" cy="280" r="3.5" fill="#5E2B32"/>
    <circle cx="180" cy="320" r="3.5" fill="#5E2B32"/>
    <circle cx="220" cy="320" r="3.5" fill="#5E2B32"/>
  </g>
  <rect x="130" y="430" width="140" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.75"/>
  <text x="200" y="449" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#6A323A" text-anchor="middle" letter-spacing="1.5">CLASSIC TRENCH</text>
</svg>
