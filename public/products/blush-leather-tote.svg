<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF5F1"/>
      <stop offset="50%" stop-color="#F8E7E1"/>
      <stop offset="100%" stop-color="#EED5CE"/>
    </linearGradient>
    <linearGradient id="leather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAAFB6"/>
      <stop offset="100%" stop-color="#C57E86"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#733F45" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="500" fill="url(#bg4)"/>
  <circle cx="200" cy="240" r="145" fill="#FFFFFF" fill-opacity="0.45"/>
  <circle cx="100" cy="120" r="65" fill="#E6BEBC" fill-opacity="0.3"/>
  <circle cx="310" cy="390" r="80" fill="#E2B7B2" fill-opacity="0.35"/>

  <!-- Tote Bag Silhouette -->
  <g filter="url(#shadow4)">
    <!-- Dual Straps / Handles -->
    <path d="M 160 210 Q 160 110 200 110 Q 240 110 240 210" fill="none" stroke="#9E565E" stroke-width="8" stroke-linecap="round"/>
    <!-- Bag Body trapezoid -->
    <path d="M 130 200 L 145 350 Q 148 360 160 360 L 240 360 Q 252 360 255 350 L 270 200 Z" fill="url(#leather)"/>
    <!-- Leather Stitch Detail -->
    <path d="M 140 210 L 152 345 L 248 345 L 260 210" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
    <!-- Gold Hardware Embellishment -->
    <rect x="194" y="235" width="12" height="18" rx="3" fill="#DFB15B"/>
    <circle cx="200" cy="244" r="2" fill="#88641C"/>
  </g>
  <rect x="130" y="430" width="140" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.75"/>
  <text x="200" y="449" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#6C373D" text-anchor="middle" letter-spacing="1.5">ITALIAN LEATHER</text>
</svg>
