<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF2EE"/>
      <stop offset="50%" stop-color="#F7E4E0"/>
      <stop offset="100%" stop-color="#EED5D1"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5999E"/>
      <stop offset="100%" stop-color="#C26D74"/>
    </linearGradient>
    <linearGradient id="silk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDA1A6"/>
      <stop offset="100%" stop-color="#B8666D"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#804046" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="500" fill="url(#bg1)"/>
  <!-- Decorative soft ambient rings -->
  <circle cx="200" cy="220" r="140" fill="#FFFFFF" fill-opacity="0.45"/>
  <circle cx="320" cy="100" r="70" fill="#E8B4B8" fill-opacity="0.3"/>
  <circle cx="80" cy="400" r="90" fill="#E2BDBC" fill-opacity="0.35"/>
  
  <!-- Stylized Dress Icon / Silhouette -->
  <g filter="url(#shadow1)">
    <!-- Straps -->
    <line x1="165" y1="120" x2="175" y2="170" stroke="#B8666D" stroke-width="4" stroke-linecap="round"/>
    <line x1="235" y1="120" x2="225" y2="170" stroke="#B8666D" stroke-width="4" stroke-linecap="round"/>
    <!-- Bodice & Flared Skirt -->
    <path d="M 172 170 Q 200 185 228 170 L 220 230 Q 200 240 180 230 Z" fill="url(#accent1)"/>
    <path d="M 180 230 Q 200 240 220 230 L 265 370 Q 200 395 135 370 Z" fill="url(#silk)"/>
    <!-- Belt accent -->
    <rect x="178" y="226" width="44" height="7" rx="3.5" fill="#FFF2F0" opacity="0.8"/>
    <!-- Elegant folds -->
    <path d="M 195 240 Q 192 310 180 375" stroke="#9A4850" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <path d="M 205 240 Q 208 310 220 375" stroke="#9A4850" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>
  <!-- Brand Tag Tagline -->
  <rect x="130" y="430" width="140" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.75"/>
  <text x="200" y="449" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#753C41" text-anchor="middle" letter-spacing="1.5">HAUTE COUTURE</text>
</svg>
