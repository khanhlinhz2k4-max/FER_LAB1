<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF3F0"/>
      <stop offset="50%" stop-color="#F6E3E0"/>
      <stop offset="100%" stop-color="#ECD4D2"/>
    </linearGradient>
    <linearGradient id="wool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAA6AD"/>
      <stop offset="100%" stop-color="#C5757E"/>
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#723940" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="500" fill="url(#bg6)"/>
  <circle cx="200" cy="235" r="140" fill="#FFFFFF" fill-opacity="0.45"/>
  <circle cx="290" cy="120" r="70" fill="#E8BABC" fill-opacity="0.3"/>
  <circle cx="95" cy="370" r="80" fill="#E2B1B4" fill-opacity="0.3"/>

  <!-- Wool Scarf Silhouette -->
  <g filter="url(#shadow6)">
    <!-- Scarf loop around neck -->
    <path d="M 140 180 C 140 130 260 130 260 180 C 260 215 140 215 140 180 Z" fill="url(#wool)"/>
    <!-- Hanging draped ends -->
    <path d="M 155 190 L 150 330 L 195 330 L 195 200 Z" fill="url(#wool)"/>
    <path d="M 205 190 L 205 355 L 250 355 L 245 200 Z" fill="#BA6972"/>
    <!-- Fringe tassels -->
    <line x1="155" y1="330" x2="155" y2="350" stroke="#7A3D44" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="165" y1="330" x2="165" y2="350" stroke="#7A3D44" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="175" y1="330" x2="175" y2="350" stroke="#7A3D44" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="185" y1="330" x2="185" y2="350" stroke="#7A3D44" stroke-width="2.5" stroke-linecap="round"/>
    
    <line x1="210" y1="355" x2="210" y2="375" stroke="#7A3D44" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="220" y1="355" x2="220" y2="375" stroke="#7A3D44" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="230" y1="355" x2="230" y2="375" stroke="#7A3D44" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="240" y1="355" x2="240" y2="375" stroke="#7A3D44" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <rect x="130" y="430" width="140" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.75"/>
  <text x="200" y="449" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#6A333A" text-anchor="middle" letter-spacing="1.5">MERINO WOOL</text>
</svg>
